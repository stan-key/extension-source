<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stan</title>
    <style>
      :root {
        color-scheme: light dark;
        --stan-ink: #010D22;
        --stan-black: #0A0A0A;
        --stan-graphite: #2A2A2A;
        --stan-grey: #686868;
        --stan-mist: #F2F2F2;
        --stan-white: #FFFFFF;
        --surface: var(--stan-white);
        --surface-raised: var(--stan-mist);
        --text: var(--stan-black);
        --text-muted: var(--stan-grey);
        --separator: color-mix(in srgb, var(--stan-black) 14%, transparent);
        --control-on: var(--stan-black);
        --control-knob: var(--stan-white);
        font: -apple-system-body;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --surface: var(--stan-black);
          --surface-raised: var(--stan-graphite);
          --text: var(--stan-white);
          --text-muted: color-mix(in srgb, var(--stan-white) 66%, transparent);
          --separator: color-mix(in srgb, var(--stan-white) 18%, transparent);
          --control-on: var(--stan-mist);
          --control-knob: var(--stan-black);
        }
      }
      * { box-sizing: border-box; }
      html {
        min-width: 360px;
        overflow-x: hidden;
      }
      body {
        width: 360px;
        max-width: 100%;
        min-width: 360px;
        margin: 0;
        color: var(--text);
        background: var(--surface);
        font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      main {
        width: 100%;
        min-height: 100%;
        padding: 18px 16px max(18px, env(safe-area-inset-bottom, 0px));
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        min-height: 44px;
        margin-bottom: 22px;
      }
      .brand-lockup { display: block; width: 104px; height: auto; }
      h1 {
        margin: 0 0 12px;
        font-size: 22px;
        font-weight: 700;
        line-height: 1.2;
        letter-spacing: -.02em;
      }
      .settings { min-width: 0; }
      .steam-bridge {
        display: grid;
        gap: 14px;
        margin: 0 0 18px;
        padding: 15px;
        border: 1px solid var(--separator);
        border-radius: 14px;
        background: var(--surface-raised);
      }
      .steam-bridge > * { min-width: 0; }
      .steam-bridge h2 { margin: 0; font-size: 18px; line-height: 1.3; }
      .steam-bridge p { margin: 6px 0 0; color: var(--text-muted); font-size: 14px; line-height: 1.45; }
      .steam-bridge-action, .share-entry-action {
        width: 100%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 52px;
        padding: 12px 18px;
        border: 1px solid var(--text);
        border-radius: 12px;
        color: var(--text);
        background: var(--surface);
        font: inherit;
        font-weight: 700;
        line-height: 1.2;
        text-align: center;
        text-decoration: none;
        cursor: pointer;
      }
      .steam-bridge-action:hover, .share-entry-action:hover { color: var(--surface); background: var(--text); }
      .steam-bridge-action:focus-visible, .share-entry-action:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
      .share-entry-action { margin: 0 0 18px; }
      .share-view { padding-bottom: 4px; }
      .share-view[hidden] { display: none; }
      .back-action { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; margin: 0 0 18px; padding: 8px 4px; border: 0; background: none; color: var(--text); font: inherit; font-weight: 650; cursor: pointer; }
      .back-action svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2; }
      .back-action:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; border-radius: 6px; }
      .share-view h1 { margin: 0 0 8px; }
      .share-intro { margin: 0 0 20px; color: var(--text-muted); font-size: 14px; line-height: 1.5; }
      .qr-frame { display: grid; place-items: center; width: 100%; padding: 20px; margin: 0 0 10px; border: 1px solid var(--separator); border-radius: 16px; background: var(--surface-raised); }
      .qr-frame canvas { width: 200px; height: 200px; }
      .qr-caption { margin: 0 0 20px; color: var(--text-muted); font-size: 13px; line-height: 1.45; text-align: center; }
      #share-status { display: none; margin: 0 0 14px; padding: 10px 12px; border: 1px solid var(--separator); border-radius: 10px; color: var(--text-muted); font-size: 13px; text-align: center; }
      #share-status.visible { display: block; }
      .share-button { width: 100%; display: inline-flex; align-items: center; justify-content: center; min-height: 52px; margin: 0 0 20px; padding: 12px 18px; border: 1px solid var(--control-on); border-radius: 12px; color: var(--surface); background: var(--control-on); font: inherit; font-weight: 750; line-height: 1.2; text-align: center; cursor: pointer; }
      .share-button:hover { color: var(--control-on); background: var(--surface); }
      .share-button:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      fieldset {
        display: grid;
        margin: 0;
        padding: 0;
        overflow: hidden;
        border: 1px solid var(--separator);
        border-radius: 14px;
        background: var(--surface-raised);
      }
      fieldset[aria-busy="true"] { opacity: .62; }
      .category {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 12px;
        min-height: 48px;
        padding: 6px 12px 6px 14px;
        cursor: pointer;
      }
      .category + .category::before {
        content: "";
        position: absolute;
        inset: 0 0 auto 14px;
        height: 1px;
        background: var(--separator);
      }
      .category:hover { background: color-mix(in srgb, var(--text) 6%, transparent); }
      .category:focus-within {
        outline: 3px solid var(--text);
        outline-offset: -3px;
      }
      .category-label {
        min-width: 0;
        font-size: 16px;
        font-weight: 500;
        line-height: 1.25;
      }
      .category input {
        position: absolute;
        inset-inline-end: 0;
        top: 50%;
        width: 48px;
        height: 44px;
        margin: 0;
        opacity: 0;
        transform: translateY(-50%);
        cursor: pointer;
      }
      .switch {
        position: relative;
        width: 44px;
        height: 26px;
        border: 1px solid var(--separator);
        border-radius: 999px;
        background: color-mix(in srgb, var(--text-muted) 24%, transparent);
        pointer-events: none;
        transition: background-color .16s ease;
      }
      .switch::after {
        content: "";
        position: absolute;
        inset-block-start: 3px;
        inset-inline-start: 3px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--control-knob);
        box-shadow: 0 1px 3px rgb(0 0 0 / .22);
        transition: transform .16s ease;
      }
      .category input:checked ~ .switch {
        border-color: var(--control-on);
        background: var(--control-on);
      }
      .category input:checked ~ .switch::after { transform: translateX(16px); }
      [dir="rtl"] .category input:checked ~ .switch::after { transform: translateX(-16px); }
      .category:has(input:disabled) { cursor: default; }
      .category:has(input:disabled) .switch { opacity: .58; }
      #status {
        display: none;
        margin: 12px 0 0;
        padding: 10px 12px;
        border: 1px solid var(--separator);
        border-radius: 10px;
        color: var(--text);
        background: var(--surface-raised);
        font-size: 13px;
        line-height: 1.4;
      }
      #status.error { display: block; }
      #status.error::before { content: "! "; font-weight: 800; }
      .legal-notice {
        margin: 16px 2px 0;
        color: var(--text-muted);
        font-size: 12px;
        line-height: 1.45;
      }
      .legal-notice a {
        color: var(--text);
        font-weight: 650;
        text-underline-offset: 2px;
      }
      .legal-notice a:focus-visible {
        outline: 3px solid var(--text);
        outline-offset: 2px;
        border-radius: 4px;
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { transition: none !important; }
      }
      /* Safari mobile peut offrir une surface plus étroite qu’un popover
         macOS. Dans ce cas, la page reprend toute la largeur disponible ; sur
         macOS, la largeur minimale empêche le menu d’être comprimé. */
      @media (max-width: 359px) {
        html, body {
          width: 100%;
          min-width: 0;
        }
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="settings-title">
      <header class="header">
        <picture>
          <source media="(prefers-color-scheme: dark)" srcset="../assets/logo/derived/stan-lockup-white.svg">
          <img class="brand-lockup" src="../assets/logo/derived/stan-lockup-ink.svg" alt="Stan">
        </picture>
      </header>
      <section class="settings" id="view-settings">
        <section class="steam-bridge" aria-labelledby="steam-bridge-title">
          <div>
            <h2 id="steam-bridge-title"></h2>
            <p id="steam-bridge-description"></p>
          </div>
          <a id="steam-bridge-action" class="steam-bridge-action" target="_blank" rel="noopener noreferrer" aria-describedby="steam-bridge-description"></a>
        </section>
        <button type="button" class="share-entry-action" data-share-toggle data-share-i18n="pageTitle">Partager Stan</button>
        <h1 id="settings-title" data-i18n="categoriesLabel">Types de vendeurs comparés</h1>
        <fieldset id="merchant-categories" aria-describedby="status" aria-busy="true" disabled>
          <legend class="sr-only" data-i18n="categoriesLabel">Types de vendeurs comparés</legend>
          <label class="category">
            <span class="category-label" data-i18n="officialReseller">Revendeurs officiels</span>
            <input type="checkbox" value="official_reseller" checked>
            <span class="switch" aria-hidden="true"></span>
          </label>
          <label class="category">
            <span class="category-label" data-i18n="directSeller">Vente directe</span>
            <input type="checkbox" value="direct_seller" checked>
            <span class="switch" aria-hidden="true"></span>
          </label>
          <label class="category">
            <span class="category-label" data-i18n="marketplace">Places de marché</span>
            <input type="checkbox" value="marketplace" checked>
            <span class="switch" aria-hidden="true"></span>
          </label>
        </fieldset>
        <p id="status" role="status" aria-live="polite"></p>
        <p class="legal-notice"><span id="legal-notice"></span> <a id="legal-link" target="_blank" rel="noopener noreferrer"></a></p>
      </section>
      <section class="share-view" id="view-share" aria-labelledby="share-title" hidden>
        <button type="button" class="back-action" data-share-back>
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"></path></svg>
          <span data-share-i18n="back">Retour</span>
        </button>
        <h1 id="share-title" data-share-i18n="pageTitle">Partager Stan</h1>
        <p class="share-intro" data-share-i18n="intro">Partagez le lien officiel de Stan ou scannez le QR code pour découvrir Stan.</p>
        <button type="button" class="share-button" data-share-button data-share-i18n="copyAction">Copier le lien Stan</button>
        <p id="share-status" role="status" aria-live="polite"></p>
        <div class="qr-frame">
          <canvas id="share-qr" width="200" height="200" role="img" aria-describedby="qr-caption"></canvas>
        </div>
        <p id="qr-caption" class="qr-caption" data-share-i18n="qrDescription">Scannez pour découvrir Stan.</p>
      </section>
    </main>
    <script type="module" src="safari-popup.js"></script>
  </body>
</html>
