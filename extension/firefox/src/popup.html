<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stan</title>
    <style>
      @font-face { font-family: Inter; src: url("../fonts/InterVariable.woff2") format("woff2"); font-weight: 100 900; font-style: normal; font-display: swap; }
      @font-face { font-family: "Inter Display"; src: url("../fonts/InterDisplay-SemiBold.woff2") format("woff2"); font-weight: 600; font-style: normal; font-display: swap; }
      :root {
        color-scheme: light;
        --stan-black: #0A0A0A;
        --stan-graphite: #2A2A2A;
        --stan-grey: #686868;
        --stan-line: color-mix(in srgb, var(--stan-black) 15%, var(--stan-white));
        --stan-mist: #F2F2F2;
        --stan-white: #FFFFFF;
        font: 16px/1.5 Inter, ui-sans-serif, system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      html { scrollbar-gutter: stable; }
      /* Le popup Chrome peut exposer un viewport CSS minuscule quand son zoom
       * est élevé. Une largeur fixe évite que l'apparition de la scrollbar
       * fasse varier la largeur, puis le retour à la ligne, pendant le scroll.
       */
      body {
        width: 360px;
        min-width: 360px;
        margin: 0;
        color: var(--stan-black);
        background: var(--stan-white);
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      main {
        min-height: 100%;
        padding-bottom: env(safe-area-inset-bottom, 0px);
        background: linear-gradient(180deg, var(--stan-white) 0%, var(--stan-mist) 180%);
      }
      .brand-header { display: grid; place-items: center; min-height: 104px; padding: 16px 64px; border-bottom: 1px solid var(--stan-line); }
      .brand-lockup { display: block; width: 248px; max-width: 100%; height: auto; margin-inline: auto; }
      .settings { padding: 20px 22px 22px; }
      .share-entry-action { display: block; width: 100%; margin: 0 0 18px; }
      .share-view { padding: 20px 22px 22px; }
      .back-action { display: inline-flex; align-items: center; gap: 8px; margin: 0 0 18px; padding: 8px 4px; border: 0; background: none; color: var(--stan-black); font: inherit; font-weight: 650; cursor: pointer; }
      .back-action svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2; }
      .back-action:focus-visible { outline: 3px solid var(--stan-black); outline-offset: 3px; border-radius: 6px; }
      .share-view h1 { margin: 0 0 8px; }
      .share-intro { margin: 0 0 20px; color: var(--stan-grey); font-size: 15px; line-height: 1.5; }
      .qr-frame { display: grid; place-items: center; width: 100%; padding: 20px; margin: 0 0 10px; border: 1px solid var(--stan-line); border-radius: 16px; background: var(--stan-white); }
      .qr-frame canvas { width: 200px; height: 200px; }
      .qr-caption { margin: 0 0 20px; color: var(--stan-grey); font-size: 13px; line-height: 1.45; text-align: center; }
      #share-status { display: none; margin: 0 0 14px; padding: 10px 12px; border: 1px solid var(--stan-line); border-radius: 10px; color: var(--stan-grey); font-size: 13px; text-align: center; }
      #share-status.visible { display: block; }
      .share-button { width: 100%; display: inline-flex; align-items: center; justify-content: center; min-height: 52px; margin: 0 0 20px; padding: 12px 18px; border: 1px solid var(--stan-black); border-radius: 12px; color: var(--stan-white); background: var(--stan-black); font-size: 16px; font-weight: 750; line-height: 1.2; text-align: center; cursor: pointer; transition: color .16s ease, background-color .16s ease, transform .16s ease; }
      .share-button:hover { color: var(--stan-black); background: var(--stan-white); transform: translateY(-1px); }
      .share-button:focus-visible { outline: 3px solid var(--stan-black); outline-offset: 2px; }
      h1 { margin: 0 0 18px; font: 600 24px/1.18 "Inter Display", Inter, sans-serif; letter-spacing: -.02em; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
      fieldset { display: grid; gap: 8px; margin: 0; padding: 0; border: 0; }
      .category { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 16px; min-height: 64px; padding: 10px 12px 10px 15px; border: 1px solid var(--stan-line); border-radius: 14px; background: var(--stan-white); cursor: pointer; transition: border-color .16s ease, background-color .16s ease, transform .16s ease; }
      .category:hover { border-color: var(--stan-grey); background: var(--stan-mist); transform: translateY(-1px); }
      .category:focus-within { outline: 3px solid var(--stan-black); outline-offset: 2px; }
      .category-label { min-width: 0; font-size: 16px; font-weight: 650; line-height: 1.35; letter-spacing: -.01em; }
      .category input { position: absolute; inset-inline-end: 6px; top: 50%; width: 56px; height: 48px; margin: 0; opacity: 0; transform: translateY(-50%); cursor: pointer; }
      .switch { position: relative; width: 46px; height: 28px; border: 1px solid color-mix(in srgb, var(--stan-black) 28%, var(--stan-white)); border-radius: 999px; background: var(--stan-mist); pointer-events: none; transition: border-color .16s ease, background-color .16s ease; }
      .switch::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--stan-white); box-shadow: 0 1px 3px rgb(0 0 0 / .22); transition: transform .16s ease; }
      .category input:checked ~ .switch { border-color: var(--stan-black); background: var(--stan-black); }
      .category input:checked ~ .switch::after { transform: translateX(18px); }
      [dir="rtl"] .category input:checked ~ .switch::after { transform: translateX(-18px); }
      .category:has(input:checked) { border-color: color-mix(in srgb, var(--stan-black) 34%, var(--stan-white)); }
      .category:has(input:disabled) { cursor: default; }
      .category:has(input:disabled) .switch { opacity: .62; }
      .steam-bridge { display: grid; gap: 14px; margin: 0 0 18px; padding: 15px; border: 1px solid var(--stan-line); border-radius: 14px; background: var(--stan-white); }
      .steam-bridge > * { min-width: 0; }
      .steam-bridge h2 { margin: 0; font: 650 18px/1.3 Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: -.01em; }
      .steam-bridge p { margin: 6px 0 0; color: var(--stan-grey); font-size: 15px; line-height: 1.5; }
      .steam-bridge-action, .share-entry-action { width: 100%; display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 12px 18px; border: 1px solid var(--stan-black); border-radius: 12px; color: var(--stan-black); background: var(--stan-white); font-size: 16px; font-weight: 750; line-height: 1.2; text-align: center; text-decoration: none; cursor: pointer; transition: color .16s ease, background-color .16s ease, transform .16s ease; }
      .steam-bridge-action:hover, .share-entry-action:hover { color: var(--stan-white); background: var(--stan-black); transform: translateY(-1px); }
      .steam-bridge-action:focus-visible, .share-entry-action:focus-visible { outline: 3px solid var(--stan-black); outline-offset: 2px; }
      .legal-notice { margin: 16px 2px 0; color: var(--stan-grey); font-size: 12px; line-height: 1.45; }
      .legal-notice a { color: var(--stan-black); font-weight: 700; text-underline-offset: 2px; }
      .legal-notice a:focus-visible { outline: 3px solid var(--stan-black); outline-offset: 2px; border-radius: 4px; }
      #status { display: none; margin: 12px 0 0; padding: 10px 12px; border: 1px solid var(--stan-black); border-radius: 10px; color: var(--stan-white); background: var(--stan-black); font-size: 12px; }
      #status.error { display: block; }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { transition: none !important; animation: none !important; }
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="settings-title">
      <header class="brand-header">
        <img class="brand-lockup" src="../assets/logo/derived/stan-lockup-ink.svg" alt="Stan">
      </header>
      <section class="settings" id="view-settings">
        <section class="steam-bridge" aria-labelledby="steam-bridge-title">
          <div>
            <h2 id="steam-bridge-title"></h2>
            <p id="steam-bridge-description"></p>
          </div>
          <a id="steam-bridge-action" class="steam-bridge-action" target="_blank" rel="noopener noreferrer" aria-describedby="steam-bridge-description"></a>
        </section>
        <button type="button" class="share-entry-action" data-share-toggle data-share-i18n="pageTitle">Share Stan</button>
        <h1 id="settings-title" data-i18n="categoriesLabel">Types de vendeurs comparés</h1>
        <fieldset id="merchant-categories" aria-describedby="status" disabled>
          <legend class="sr-only" data-i18n="categoriesLabel">Types de vendeurs comparés</legend>
          <label class="category">
            <span class="category-label" data-i18n="officialReseller">Revendeurs officiels</span>
            <input type="checkbox" value="official_reseller" checked>
            <span class="switch" aria-hidden="true"></span>
          </label>
          <label class="category">
            <span class="category-label" data-i18n="directSeller">Vente directe</span>
            <input type="checkbox" value="direct_seller" checked>
            <span class="switch" aria-hidden="true"></span>
          </label>
          <label class="category">
            <span class="category-label" data-i18n="marketplace">Places de marché</span>
            <input type="checkbox" value="marketplace" checked>
            <span class="switch" aria-hidden="true"></span>
          </label>
        </fieldset>
        <p id="status" role="status" aria-live="polite"></p>
        <p class="legal-notice"><span id="legal-notice"></span> <a id="legal-link" target="_blank" rel="noopener noreferrer"></a></p>
      </section>
      <section class="share-view" id="view-share" aria-labelledby="share-title" hidden>
        <button type="button" class="back-action" data-share-back>
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"></path></svg>
          <span data-share-i18n="back">Back</span>
        </button>
        <h1 id="share-title" data-share-i18n="pageTitle">Share Stan</h1>
        <p class="share-intro" data-share-i18n="intro">Share the official Stan link or scan the QR code to discover Stan.</p>
        <button type="button" class="share-button" data-share-button data-share-i18n="copyAction">Copy Stan link</button>
        <p id="share-status" role="status" aria-live="polite"></p>
        <div class="qr-frame">
          <canvas id="share-qr" width="200" height="200" role="img" aria-describedby="qr-caption"></canvas>
        </div>
        <p id="qr-caption" class="qr-caption" data-share-i18n="qrDescription">Scan to discover Stan.</p>
      </section>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
