<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stan</title>
    <link rel="stylesheet" href="steam-install.css">
  </head>
  <body>
    <main>
      <header class="steam-install-header">
        <img class="steam-install-brand" src="../assets/logo/derived/stan-lockup-white.svg" alt="Stan">
      </header>
      <section class="intro" aria-labelledby="page-title">
        <h1 id="page-title" data-compliance-i18n="pageTitle"></h1>
        <p class="lead"><span data-i18n="lead"></span><span data-i18n="leadSteps"></span></p>
        <ul class="perks">
          <li><svg class="perk-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"></path></svg><span data-i18n="perkFiles"></span></li>
          <li><svg class="perk-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"></path></svg><span data-i18n="perkAccount"></span></li>
        </ul>
      </section>

      <ol class="steps" aria-labelledby="page-title">
        <li class="step"><span class="step-number" aria-hidden="true">1</span><p data-i18n="step1"></p></li>
        <li class="step copy-step">
          <span class="step-number" aria-hidden="true">2</span>
          <div><p data-i18n="step2"></p><div class="copy-row"><code data-store-url></code><button type="button" class="copy-button" data-copy="store"><svg class="copy-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"></path></svg><span data-copy-label data-i18n="copyLink" aria-live="polite"></span></button></div></div>
        </li>
        <li class="step"><span class="step-number" aria-hidden="true">3</span><p data-i18n="step3"></p></li>
        <li class="step"><span class="step-number" aria-hidden="true">4</span><p data-i18n="step4"></p></li>
      </ol>
      <p class="done"><img class="done-icon" src="../assets/comparator/lightning.svg" alt="" aria-hidden="true"><span data-i18n="done"></span></p>

      <details class="uninstall">
        <summary data-i18n="uninstallTitle"></summary>
        <div class="uninstall-body copy-step">
          <p data-i18n="uninstallIntro"></p>
          <div class="copy-row"><code data-extensions-url></code><button type="button" class="copy-button copy-button-quiet" data-copy="extensions"><svg class="copy-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"></path></svg><span data-copy-label data-i18n="copyAddress" aria-live="polite"></span></button></div>
        </div>
      </details>

      <footer class="legal-notice">
        <p data-compliance-i18n="platformDisclosure"></p>
        <p data-compliance-i18n="comparisonDisclosure"></p>
        <p><span id="legal-notice"></span> <a id="legal-link" target="_blank" rel="noopener noreferrer"></a></p>
      </footer>
    </main>
    <script type="module" src="steam-install.js"></script>
  </body>
</html>
